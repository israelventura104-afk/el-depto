<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8b4a28" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="El depto" />
  <title>El depto · Israel y Dario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d9b7a'/%3E%3Cpath d='M20 36c0-8 5-14 12-14 5 0 9 3 10 7' stroke='white' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='34' r='3' fill='white'/%3E%3Cpath d='M44 28c0 8-5 14-12 14-5 0-9-3-10-7' stroke='white' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --bg: #f3e8d6;
      --card: #fffaf3;
      --ink: #2a1b12;
      --muted: #7a5c4a;
      --line: #ead7c0;
      --teal: #c45a32;
      --teal-ink: #8b3418;
      --teal-soft: #f6d7c6;
      --sky: #4ea0d4;
      --navy: #2b5f8a;
      --owe: #c43b3b;
      --owe-soft: #fdecec;
      --shadow: 0 10px 28px rgba(90, 48, 24, 0.10);
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --cover: url("cover.jpg?v=2");
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      font-family: Outfit, "Segoe UI", system-ui, sans-serif;
      background:
        radial-gradient(900px 420px at 50% -80px, #f7d7a8 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }
    button, input, select { font: inherit; }
    button { cursor: pointer; border: 0; background: none; color: inherit; }
    input, select {
      width: 100%;
      border: 1.5px solid var(--line);
      background: #fff;
      border-radius: 14px;
      padding: 14px 14px;
      font-size: 16px;
      color: var(--ink);
      outline: none;
    }
    input:focus, select:focus { border-color: var(--teal); box-shadow: 0 0 0 4px var(--teal-soft); }
    .app {
      max-width: 430px;
      margin: 0 auto;
      min-height: 100%;
      padding: calc(18px + var(--safe-t)) 16px calc(96px + var(--safe-b));
      position: relative;
    }
    .app.is-home { padding: 0 0 calc(96px + var(--safe-b)); }
    .pad { padding: 0 16px; }
    .hidden { display: none !important; }

    /* Onboarding */
    .setup {
      min-height: calc(100vh - 40px);
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 18px;
      padding-bottom: 40px;
    }
    .setup-cover {
      margin: -8px -4px 4px;
      height: 210px;
      border-radius: 22px;
      background: var(--cover) center 22% / cover no-repeat;
      box-shadow: 0 14px 32px rgba(90, 48, 24, .22);
      position: relative;
      overflow: hidden;
    }
    .setup-cover::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(42,27,18,.55) 100%);
    }
    .mark {
      width: 56px; height: 56px; border-radius: 16px;
      background: var(--teal); color: #fff;
      display: grid; place-items: center;
      font-weight: 800; font-size: 26px;
      box-shadow: 0 10px 24px rgba(196,90,50,.35);
    }
    h1 { font-size: 30px; letter-spacing: -.03em; line-height: 1.15; }
    .lede { color: var(--muted); font-size: 15px; line-height: 1.45; }
    .field { display: flex; flex-direction: column; gap: 6px; }
    .field span { font-size: 13px; font-weight: 600; color: var(--muted); }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 52px; padding: 0 18px; border-radius: 16px;
      background: var(--teal); color: #fff; font-weight: 700;
      box-shadow: 0 8px 18px rgba(196,90,50,.28);
    }
    .btn:active { transform: translateY(1px); }
    .btn.ghost {
      background: #fff; color: var(--ink); box-shadow: none;
      border: 1.5px solid var(--line);
    }
    .btn.danger { background: var(--owe); box-shadow: none; }
    .btn.full { width: 100%; }

    /* Cover like Splitwise group */
    .cover {
      position: relative;
      height: 318px;
      overflow: hidden;
      background: #8b4a28;
    }
    .cover img {
      width: 100%; height: 100%;
      object-fit: cover;
      object-position: 50% 18%;
      display: block;
      transform: scale(1.04);
    }
    .cover-fade {
      position: absolute; inset: 0;
      background:
        linear-gradient(180deg, rgba(42,27,18,.15) 0%, transparent 28%, transparent 42%, rgba(42,27,18,.78) 100%);
      pointer-events: none;
    }
    .cover-gear {
      position: absolute;
      top: calc(12px + var(--safe-t));
      right: 14px;
      width: 40px; height: 40px; border-radius: 50%;
      background: rgba(255,255,255,.22);
      backdrop-filter: blur(10px);
      color: #fff;
      display: grid; place-items: center;
      border: 1px solid rgba(255,255,255,.35);
    }
    .cover-meta {
      position: absolute; left: 16px; right: 16px; bottom: 48px;
      color: #fff;
    }
    .cover-avatars { display: flex; margin-bottom: 8px; }
    .av {
      width: 42px; height: 42px; border-radius: 50%;
      display: grid; place-items: center; font-weight: 700; color: #fff;
      border: 2px solid rgba(255,255,255,.9);
      box-shadow: 0 4px 12px rgba(0,0,0,.25);
      background-size: 340%;
      background-repeat: no-repeat;
      overflow: hidden;
    }
    .av.a { background-image: var(--cover); background-position: 18% 20%; }
    .av.b { background-image: var(--cover); background-position: 78% 22%; margin-left: -12px; }
    .cover-meta h1 {
      font-size: 28px; letter-spacing: -.03em; text-shadow: 0 2px 16px rgba(0,0,0,.35);
    }
    .cover-meta p {
      font-size: 14px; opacity: .92; font-weight: 500;
      text-shadow: 0 1px 8px rgba(0,0,0,.35);
    }

    .hero {
      background: linear-gradient(165deg, #c45a32 0%, #9a3d1e 100%);
      color: #fff; border-radius: 22px; padding: 18px 18px 16px;
      box-shadow: 0 16px 36px rgba(154, 61, 30, .28);
      margin: -38px 16px 14px;
      position: relative;
      z-index: 2;
    }
    .hero .label { opacity: .82; font-size: 13px; font-weight: 500; }
    .hero .amount {
      font-size: 36px; font-weight: 800; letter-spacing: -.04em;
      margin: 4px 0 8px; line-height: 1.05;
    }
    .hero .sub { font-size: 14px; opacity: .92; }
    .hero.even {
      background: linear-gradient(165deg, #2b5f8a 0%, #1d4060 100%);
      box-shadow: 0 16px 36px rgba(29, 64, 96, .25);
    }
    .hero-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-top: 14px; }
    .hero .btn { background: rgba(255,255,255,.16); box-shadow: none; min-height: 42px; font-size: 14px; }
    .hero .btn:hover { background: rgba(255,255,255,.24); }

    .icon-btn {
      width: 40px; height: 40px; border-radius: 12px; background: #fff;
      display: grid; place-items: center; border: 1.5px solid var(--line);
    }

    .month-bar {
      display: flex; align-items: center; justify-content: space-between;
      margin: 8px 18px 12px; color: var(--muted); font-size: 13px; font-weight: 600;
    }

    .list { display: flex; flex-direction: column; gap: 8px; padding: 0 16px; }
    .group-title {
      font-size: 12px; font-weight: 700; color: var(--muted);
      text-transform: uppercase; letter-spacing: .06em;
      margin: 10px 4px 2px;
    }
    .item {
      background: var(--card); border-radius: 18px; padding: 12px 12px;
      display: grid; grid-template-columns: 42px 1fr auto; gap: 10px; align-items: center;
      box-shadow: var(--shadow); width: 100%; text-align: left;
    }
    .item .dot {
      width: 42px; height: 42px; border-radius: 14px;
      background: var(--teal-soft); color: var(--teal-ink);
      display: grid; place-items: center; font-size: 18px;
    }
    .item .dot.settle { background: #dceaf4; }
    .item b { display: block; font-size: 15px; font-weight: 650; }
    .item .meta { color: var(--muted); font-size: 12px; margin-top: 2px; }
    .item .cash { font-weight: 700; font-size: 15px; }
    .item .share { display: block; font-size: 11px; color: var(--muted); text-align: right; margin-top: 2px; }
    .item .dot.pic {
      background-size: cover; background-position: center; font-size: 0;
      border: 0;
    }
    .photo-box {
      border: 1.5px dashed var(--line); border-radius: 16px; overflow: hidden;
      background: #fff; min-height: 88px; position: relative;
    }
    .photo-box img { width: 100%; max-height: 220px; object-fit: cover; display: block; }
    .photo-box .photo-actions {
      display: flex; gap: 8px; padding: 10px;
    }
    .photo-box .photo-actions .btn { min-height: 42px; font-size: 14px; }
    .receipt {
      width: 100%; border-radius: 16px; overflow: hidden;
      background: #111; max-height: 360px;
    }
    .receipt img { width: 100%; max-height: 360px; object-fit: contain; display: block; }

    .empty {
      text-align: center; padding: 36px 12px; color: var(--muted);
    }
    .empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }

    .fab {
      position: fixed; left: 50%; transform: translateX(-50%);
      bottom: calc(18px + var(--safe-b));
      width: min(398px, calc(100% - 32px));
      z-index: 5;
    }

    /* Sheets */
    .overlay {
      position: fixed; inset: 0; background: rgba(42, 27, 18, .48);
      z-index: 20; display: flex; align-items: flex-end; justify-content: center;
    }
    .sheet {
      width: min(430px, 100%);
      background: #fffaf3;
      border-radius: 24px 24px 0 0;
      padding: 10px 16px calc(18px + var(--safe-b));
      max-height: 92vh; overflow: auto;
      animation: up .22s ease;
    }
    @keyframes up { from { transform: translateY(24px); opacity: .6; } }
    .grab {
      width: 42px; height: 5px; border-radius: 99px; background: #e4d0ba;
      margin: 4px auto 14px;
    }
    .sheet h2 { font-size: 20px; margin-bottom: 14px; }
    .amount-box { text-align: center; margin: 4px 0 14px; }
    .amount-box input {
      border: 0; box-shadow: none; text-align: center;
      font-size: 44px; font-weight: 800; letter-spacing: -.04em; padding: 0;
    }
    .amount-box input:focus { box-shadow: none; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      flex: 1; min-height: 44px; border-radius: 14px;
      border: 1.5px solid var(--line); background: #fff; font-weight: 650; font-size: 14px;
    }
    .chip.on { border-color: var(--teal); background: var(--teal-soft); color: var(--teal-ink); }
    .stack { display: flex; flex-direction: column; gap: 12px; }
    .hint { font-size: 13px; color: var(--muted); line-height: 1.4; }
    .toast {
      position: fixed; left: 50%; bottom: calc(84px + var(--safe-b));
      transform: translateX(-50%);
      background: #2a1b12; color: #fff; padding: 10px 14px; border-radius: 12px;
      font-size: 13px; z-index: 40; white-space: nowrap;
    }

    .settings .danger-zone { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    textarea {
      width: 100%; min-height: 90px; border-radius: 14px; border: 1.5px solid var(--line);
      padding: 12px; font: inherit; font-size: 13px; resize: vertical;
    }
    .sync-pill {
      display: inline-flex; align-items: center; gap: 6px;
      margin-top: 10px; padding: 5px 10px; border-radius: 99px;
      background: rgba(255,255,255,.18); border: 1px solid rgba(255,255,255,.3);
      color: #fff; font-size: 12px; font-weight: 650;
    }
    .sync-pill i {
      width: 8px; height: 8px; border-radius: 50%; background: #8ef0b6;
      box-shadow: 0 0 0 3px rgba(142,240,182,.25);
    }
    .sync-pill.saving i { background: #ffd36a; box-shadow: none; }
    .sync-pill.err i, .sync-pill.off i { background: #ffb020; box-shadow: none; }
    .home-grid { display: block; }

    @media (min-width: 900px) {
      body {
        background:
          radial-gradient(1200px 500px at 50% -120px, #f3c98a 0%, transparent 55%),
          #e8d2b4;
      }
      .app {
        max-width: 1080px;
      }
      .app.is-home {
        max-width: 1080px;
        margin: 28px auto 36px;
        background: #f7efe3;
        border-radius: 28px;
        overflow: hidden;
        box-shadow: 0 28px 70px rgba(90, 48, 24, .18);
        padding-bottom: 28px;
        min-height: calc(100vh - 64px);
      }
      .cover { height: 420px; }
      .cover img { object-position: 50% 18%; }
      .cover-meta { left: 32px; bottom: 58px; }
      .cover-meta h1 { font-size: 42px; }
      .cover-gear { top: 18px; right: 18px; width: 46px; height: 46px; }
      .home-grid {
        display: grid;
        grid-template-columns: 360px 1fr;
        gap: 24px;
        padding: 0 28px 4px;
        align-items: start;
      }
      .hero {
        margin: -56px 0 0;
        padding: 22px 22px 18px;
      }
      .hero .amount { font-size: 40px; }
      .month-bar { margin: 10px 0 12px; }
      .list { padding: 0; }
      .item { padding: 14px; }
      .fab {
        position: static;
        transform: none;
        width: 100%;
        margin-top: 14px;
      }
      .overlay { align-items: center; }
      .sheet {
        width: min(480px, 92vw);
        border-radius: 24px;
        max-height: 86vh;
        margin: 24px;
      }
      .setup { max-width: 480px; margin: 0 auto; padding-top: 12px; }
      .setup-cover { height: 280px; }
      .toast { bottom: 28px; }
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <div id="overlay"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="splitwise-data.js"></script>
  <script>
    const KEY = "cuentas-roomie-v1";
    const ROOM_KEY = "cuentas-roomie-room";
    const ME_KEY = "cuentas-roomie-me";
    const BLOB = "https://jsonblob.com/api/jsonBlob";
    const GH_RAW = "https://raw.githubusercontent.com/israelventura104-afk/el-depto/main";
    const $ = (id) => document.getElementById(id);

    const ICONS = {
      super: "🛒", comida: "🍕", renta: "🏠", luz: "💡", agua: "🚿",
      gas: "🔥", internet: "📶", uber: "🚗", taxi: "🚕",
      farmacia: "💊", limpia: "🧹", mascota: "🐾", extra: "💸",
      settle: "🤝"
    };

    const CURRENCIES = [
      { code: "MXN", symbol: "$", locale: "es-MX" },
      { code: "USD", symbol: "US$", locale: "en-US" },
      { code: "EUR", symbol: "€", locale: "es-ES" },
      { code: "ARS", symbol: "$", locale: "es-AR" },
      { code: "COP", symbol: "$", locale: "es-CO" },
      { code: "CLP", symbol: "$", locale: "es-CL" },
      { code: "PEN", symbol: "S/", locale: "es-PE" },
    ];

    function uid() {
      return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
    }

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY) || "null"); }
      catch { return null; }
    }
    function localSave() {
      localStorage.setItem(KEY, JSON.stringify(state));
    }
    function save() {
      if (state) state.updatedAt = Date.now();
      localSave();
      schedulePush();
    }

    function parseAmount(raw) {
      let s = String(raw).trim().replace(/[^\d,.-]/g, "");
      if (!s) return NaN;
      if (s.includes(",") && s.includes(".")) {
        if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g, "").replace(",", ".");
        else s = s.replace(/,/g, "");
      } else if (s.includes(",")) {
        s = s.replace(",", ".");
      }
      const n = Number(s);
      return Number.isFinite(n) ? n : NaN;
    }

    function money(n, state) {
      const cur = CURRENCIES.find((c) => c.code === state.currency) || CURRENCIES[0];
      try {
        return new Intl.NumberFormat(cur.locale, {
          style: "currency",
          currency: cur.code,
          maximumFractionDigits: 2,
        }).format(n);
      } catch {
        return cur.symbol + Number(n).toFixed(2);
      }
    }

    function iconFor(desc, type) {
      if (type === "settle") return ICONS.settle;
      const t = (desc || "").toLowerCase();
      for (const [k, v] of Object.entries(ICONS)) {
        if (k !== "settle" && t.includes(k)) return v;
      }
      if (/super|walmart|soriana|oxxo|chedraui|mercado/.test(t)) return "🛒";
      if (/luz|cfe|electric/.test(t)) return "💡";
      if (/renta|alquiler|depto|casa/.test(t)) return "🏠";
      if (/uber|didi|gasolina|taxi/.test(t)) return "🚗";
      if (/comida|pizza|tacos|restaurante|rappi/.test(t)) return "🍕";
      if (/netflix|spotify|internet|wifi/.test(t)) return "📶";
      return "💸";
    }

    function when(ts) {
      const d = new Date(ts);
      const now = new Date();
      const one = 86400000;
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const diff = (start - day) / one;
      if (diff === 0) return "Hoy";
      if (diff === 1) return "Ayer";
      return d.toLocaleDateString("es", { day: "numeric", month: "short" });
    }

    function monthKey(ts) {
      const d = new Date(ts);
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    }
    function monthLabel(key) {
      const [y, m] = key.split("-").map(Number);
      const d = new Date(y, m - 1, 1);
      const now = new Date();
      if (y === now.getFullYear() && m === now.getMonth() + 1) return "Este mes";
      return d.toLocaleDateString("es", { month: "long", year: "numeric" });
    }

    function shareOf(e) {
      if (e.type === "settle") return e.amount;
      if (e.owed != null) return Number(e.owed);
      return e.split === "full" ? e.amount : e.amount / 2;
    }

    /** net > 0 ⇒ B le debe a A. net < 0 ⇒ A le debe a B. */
    function netOf(state) {
      let net = 0;
      for (const e of state.expenses) {
        const share = shareOf(e);
        if (e.type === "settle") net += e.paidBy === "a" ? share : -share;
        else net += e.paidBy === "a" ? share : -share;
      }
      return Math.round(net * 100) / 100;
    }

    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.remove("hidden");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.add("hidden"), 2200);
    }

    let state = load();
    let ui = { sheet: null, editId: null, importOpen: false };
    let me = localStorage.getItem(ME_KEY) || "";
    let roomId = "depto";
    let syncStatus = "saving";
    let apiBase = null;
    let pushTimer = null;
    let pulling = false;
    let pushing = false;

    if (roomId) {
      localStorage.setItem(ROOM_KEY, roomId);
      const u = new URL(location.href);
      u.searchParams.set("sala", roomId);
      history.replaceState(null, "", u);
    }

    function setMe(who) {
      me = who;
      localStorage.setItem(ME_KEY, who);
    }

    function setRoom(id) {
      roomId = String(id || "").trim();
      if (!roomId) return;
      localStorage.setItem(ROOM_KEY, roomId);
      const u = new URL(location.href);
      u.searchParams.set("sala", roomId);
      history.replaceState(null, "", u);
    }

    function shareLink() {
      const u = new URL(location.href);
      if (roomId) u.searchParams.set("sala", roomId);
      return u.toString();
    }

    function payload() {
      return {
        ready: true,
        a: state.a,
        b: state.b,
        currency: state.currency,
        expenses: state.expenses || [],
        deleted: state.deleted || {},
        updatedAt: state.updatedAt || Date.now(),
      };
    }

    function blobIdFromResponse(res) {
      const loc = res.headers.get("Location") || res.headers.get("location") || "";
      const part = loc.split("/").filter(Boolean).pop();
      return part || "";
    }

    const photoCache = {};

    function compressImage(file, maxSide, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("img")); };
        img.src = url;
      });
    }

    async function discoverApi() {
      try {
        const r = await fetch(GH_RAW + "/tunnel.json?t=" + Date.now(), { cache: "no-store" });
        if (!r.ok) return null;
        const t = await r.json();
        if (!t || !t.url) return null;
        const health = await fetch(String(t.url).replace(/\/$/, "") + "/health", { cache: "no-store" });
        if (!health.ok) return null;
        apiBase = String(t.url).replace(/\/$/, "");
        return apiBase;
      } catch {
        apiBase = null;
        return null;
      }
    }

    async function uploadPhoto(dataUrl) {
      await discoverApi();
      if (apiBase) {
        const res = await fetch(apiBase + "/photo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ d: dataUrl }),
        });
        if (!res.ok) throw new Error("foto " + res.status);
        const j = await res.json();
        if (!j.id) throw new Error("sin id foto");
        photoCache[j.id] = dataUrl;
        try { localStorage.setItem("foto-" + j.id, dataUrl); } catch {}
        return j.id;
      }
      photoCache[dataUrl.slice(0, 40)] = dataUrl;
      return dataUrl;
    }

    async function fetchPhoto(id) {
      if (!id) return null;
      if (id.indexOf("data:image") === 0) return id;
      if (photoCache[id]) return photoCache[id];
      try {
        const local = localStorage.getItem("foto-" + id);
        if (local) { photoCache[id] = local; return local; }
      } catch {}
      await discoverApi();
      if (apiBase) {
        const res = await fetch(apiBase + "/photo/" + encodeURIComponent(id), { cache: "no-store" });
        if (res.ok) {
          const j = await res.json();
          if (j && j.d) {
            photoCache[id] = j.d;
            try { localStorage.setItem("foto-" + id, j.d); } catch {}
            return j.d;
          }
        }
      }
      return null;
    }

    function schedulePush() {
      clearTimeout(pushTimer);
      pushTimer = setTimeout(pushNow, 280);
    }

    async function pushNow() {
      if (pushing) return;
      pushing = true;
      syncStatus = "saving";
      updateSyncPill();
      try {
        await discoverApi();
        if (!apiBase) throw new Error("sin tunel");
        const res = await fetch(apiBase + "/state", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload()),
        });
        if (!res.ok) throw new Error("put " + res.status);
        syncStatus = "live";
      } catch {
        syncStatus = "readonly";
      } finally {
        pushing = false;
        updateSyncPill();
      }
    }

    function mergeStates(local, remote) {
      if (!local || !local.ready) return { ...remote, ready: true };
      const deleted = { ...(remote.deleted || {}), ...(local.deleted || {}) };
      const map = new Map();
      for (const e of remote.expenses || []) if (e && e.id && !deleted[e.id]) map.set(e.id, e);
      for (const e of local.expenses || []) {
        if (!e || !e.id || deleted[e.id]) continue;
        const prev = map.get(e.id);
        if (!prev || (e.updatedAt || e.ts || 0) >= (prev.updatedAt || prev.ts || 0)) map.set(e.id, e);
      }
      const localNewer = (local.updatedAt || 0) >= (remote.updatedAt || 0);
      return {
        ready: true,
        a: localNewer ? (local.a || remote.a) : (remote.a || local.a),
        b: localNewer ? (local.b || remote.b) : (remote.b || local.b),
        currency: localNewer ? (local.currency || remote.currency) : (remote.currency || local.currency),
        expenses: [...map.values()],
        deleted,
        updatedAt: Math.max(local.updatedAt || 0, remote.updatedAt || 0),
      };
    }

    async function pull() {
      if (pulling || pushing) return;
      pulling = true;
      try {
        await discoverApi();
        let remote = null;
        if (apiBase) {
          const res = await fetch(apiBase + "/state", { cache: "no-store" });
          if (res.ok) remote = await res.json();
          syncStatus = "live";
        } else {
          const res = await fetch(GH_RAW + "/data.json?t=" + Date.now(), { cache: "no-store" });
          if (res.ok) remote = await res.json();
          syncStatus = remote ? "readonly" : "err";
        }
        if (!remote || !Array.isArray(remote.expenses)) return;
        const merged = mergeStates(state, remote);
        const before = JSON.stringify({
          a: state && state.a, b: state && state.b, c: state && state.currency,
          e: state && state.expenses, d: state && state.deleted,
        });
        const after = JSON.stringify({
          a: merged.a, b: merged.b, c: merged.currency, e: merged.expenses, d: merged.deleted,
        });
        if (before !== after) {
          state = merged;
          localSave();
          if (!ui.sheet) render();
        }
      } catch {
        if (syncStatus !== "saving") syncStatus = "err";
      } finally {
        pulling = false;
        updateSyncPill();
      }
    }

    async function ensureRoom() {
      await pull();
      if (state && state.ready && apiBase) await pushNow();
    }

    function syncLabel() {
      if (syncStatus === "live") return "En vivo · copiar enlace";
      if (syncStatus === "saving") return "Guardando…";
      if (syncStatus === "readonly") return "Viendo la última copia";
      if (syncStatus === "err") return "Sin conexión · reintentar";
      return "Solo este aparato";

      const el = $("syncPill");

        } else {
          label = `${state.b} te debe`;
          sub = `${state.b} le debe a ${state.a}`;
        }
      } else {
        amount = money(Math.abs(net), state);

        if (me === "b") {
          label = `${state.a} te debe`;
          sub = `${state.a} le debe a ${state.b}`;

                <span class="share">${esc(share)}</span>
              </div>
            </button>`;
        }
      }

      return `

          <img src="cover.jpg?v=2" alt="Israel y Dario frente a la casa" />

              <span>${state.currency}</span>

    function bindSheet() {
      const backdrop = $("backdrop");
      if (!backdrop) return;
      backdrop.onclick = closeSheet;
      const cancel = $("cancelSheet");
      if (cancel) cancel.onclick = closeSheet;

      if (ui.sheet === "add") {
        let paid = (ui.editId && state.expenses.find((e) => e.id === ui.editId)?.paidBy) || "a";
        let split = (ui.editId && state.expenses.find((e) => e.id === ui.editId)?.split) || "half";
        const hint = () => {
          const n = parseAmount($("amt").value);
          const who = paid === "a" ? state.a : state.b;
          const other = paid === "a" ? state.b : state.a;
          if (!Number.isFinite(n) || n <= 0) {
            $("splitHint").textContent = split === "half"
              ? `Se parte en dos. ${other} le queda debiendo la mitad a ${who}.`
              : `${other} le debe el total a ${who}.`;
            return;
          }
          $("splitHint").textContent = split === "half"
            ? `${other} le queda debiendo ${money(n / 2, state)} a ${who}.`
            : `${other} le queda debiendo ${money(n, state)} a ${who}.`;
        };
        hint();
        $("amt").addEventListener("input", hint);
        for (const c of document.querySelectorAll("[data-paid]")) {
          c.onclick = () => {
            paid = c.dataset.paid;
            document.querySelectorAll("[data-paid]").forEach((x) => x.classList.toggle("on", x === c));
            hint();
          };
        }
        for (const c of document.querySelectorAll("[data-split]")) {
          c.onclick = () => {
            split = c.dataset.split;
            document.querySelectorAll("[data-split]").forEach((x) => x.classList.toggle("on", x === c));
            hint();
          };
        }
        let pendingPhoto = null;
        let pendingThumb = null;
        let photoRemoved = false;
        const existing = ui.editId ? state.expenses.find((e) => e.id === ui.editId) : null;
        $("photoBtn").onclick = () => $("photoFile").click();
        $("photoClear").onclick = () => {
          pendingPhoto = null;
          pendingThumb = null;
          photoRemoved = true;
          $("photoPrev").src = "";
          $("photoPrev").classList.add("hidden");
          $("photoClear").classList.add("hidden");
        };
        $("photoFile").onchange = async (ev) => {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          try {
            toast("Preparando foto…");
            pendingPhoto = await compressImage(file, 900, 0.62);
            pendingThumb = await compressImage(file, 96, 0.5);
            photoRemoved = false;
            $("photoPrev").src = pendingThumb;
            $("photoPrev").classList.remove("hidden");
            $("photoClear").classList.remove("hidden");
            toast("Foto lista");
          } catch {
            toast("No se pudo leer esa foto");
          }
        };
        $("saveExp").onclick = async () => {
          const amount = parseAmount($("amt").value);
          const desc = $("desc").value.trim();
          if (!Number.isFinite(amount) || amount <= 0) { toast("Pon un monto válido"); return; }
          const btn = $("saveExp");
          btn.disabled = true;
          let photoId = existing ? existing.photoId : null;
          let photoThumb = existing ? existing.photoThumb : null;
          if (photoRemoved) { photoId = null; photoThumb = null; }
          if (pendingPhoto) {
            try {
              toast("Subiendo foto…");
              photoId = await uploadPhoto(pendingPhoto);
              photoThumb = pendingThumb;
            } catch {
              btn.disabled = false;
              toast("La foto no se pudo subir. Revisa internet");
              return;
            }
          }
          if (ui.editId) {
            const e = state.expenses.find((x) => x.id === ui.editId);
            if (e) Object.assign(e, { amount, desc, paidBy: paid, split, updatedAt: Date.now(), photoId, photoThumb });
          } else {
            state.expenses.push({
              id: uid(), type: "expense", amount, desc, paidBy: paid, split,
              ts: Date.now(), updatedAt: Date.now(), photoId, photoThumb,
            });
          }
          save();
          closeSheet();
          toast("Listo");
        };
        setTimeout(() => $("amt").focus(), 50);
      }

      if (ui.sheet === "settle") {
        $("saveSettle").onclick = () => {
          const amount = parseAmount($("settleAmt").value);
          if (!Number.isFinite(amount) || amount <= 0) { toast("Pon un monto válido"); return; }
          const net = netOf(state);
          const payer = net > 0 ? "b" : "a";
          state.expenses.push({
            id: uid(), type: "settle", amount, desc: "Saldaron", paidBy: payer, split: "full", ts: Date.now(), updatedAt: Date.now(),
          });
          save();
          closeSheet();
          toast("Quedó registrado");
        };
      }

      if (ui.sheet === "detail") {
        const current = state.expenses.find((x) => x.id === ui.editId);
        if (current && current.photoId) {
          fetchPhoto(current.photoId).then((d) => {
            if (!d || !$("receiptImg")) return;
            $("receiptImg").src = d;
            $("receiptBox").classList.remove("hidden");
          });
        }
        const edit = $("editExp");
        if (edit) edit.onclick = () => { ui.sheet = "add"; render(); };
        $("delExp").onclick = () => {
          state.deleted = state.deleted || {};
          state.deleted[ui.editId] = Date.now();
          state.expenses = state.expenses.filter((x) => x.id !== ui.editId);
          save();
          closeSheet();
          toast("Borrado");
        };
      }

      if (ui.sheet === "settings") {
        for (const c of document.querySelectorAll("[data-me]")) {
          c.onclick = () => {
            setMe(c.dataset.me);
            document.querySelectorAll("[data-me]").forEach((x) => x.classList.toggle("on", x === c));
          };
        }
        $("copyLinkBtn").onclick = async () => {
          await ensureRoom();
          copyText("https://israelventura104-afk.github.io/el-depto/");
          toast(syncStatus === "live" ? "Enlace copiado. Ya está en vivo" : "Enlace copiado. En la lap abre EnVivo.bat");
        };
        $("retrySyncBtn").onclick = async () => {
          await ensureRoom();
          await pushNow();
          toast(syncStatus === "live" ? "Al día" : "No se pudo sincronizar");
        };
        $("saveSet").onclick = () => {
          const a = $("setA").value.trim();
          const b = $("setB").value.trim();
          if (!a || !b) { toast("Faltan nombres"); return; }
          state.a = a; state.b = b; state.currency = $("setCur").value;
          save();
          closeSheet();
          toast("Guardado");
        };
        $("loadSeedBtn").onclick = () => {
          const seed = splitwiseSeed();
          if (!seed) return;
          if (state.expenses.length && !confirm("Esto reemplaza los gastos actuales por los de Splitwise.")) return;
          applyImportedState({
            ...seed,
            a: state.a,
            b: state.b,
            currency: state.currency,
            ready: true,
          });
        };
        $("csvBtn").onclick = () => $("csvFile").click();
        $("csvFile").onchange = (ev) => importFromFile(ev.target.files[0], { a: state.a, b: state.b, currency: state.currency });
        $("exportBtn").onclick = () => {
          copyText(JSON.stringify(state));
          toast("Respaldo copiado");
        };
        $("importBtn").onclick = () => { ui.importOpen = true; render(); };
        const doImp = $("doImport");
        if (doImp) {
          doImp.onclick = () => {
            try {
              const data = JSON.parse($("importBox").value);
              if (!data || !data.a || !data.b || !Array.isArray(data.expenses)) throw new Error("bad");
              data.ready = true;
              data.updatedAt = Date.now();
              state = data;
              save();
              closeSheet();
              toast("Importado");
            } catch {
              toast("Ese respaldo no sirve");
            }
          };
        }
        $("wipeBtn").onclick = () => {
          if (!confirm("¿Borrar todos los gastos?")) return;
          state = null;
          localStorage.removeItem(KEY);
          closeSheet();
        };
      }
    }

    function splitwiseSeed() {
      if (typeof SPLITWISE_SEED === "undefined") {
        toast("No está el archivo splitwise-data.js");
        return null;
      }
      return SPLITWISE_SEED;
    }

    function applyImportedState(data) {
      if (!data || !Array.isArray(data.expenses)) {
        toast("No se pudo importar");
        return;
      }
      state = {
        ready: true,
        a: data.a || "Israel",
        b: data.b || "Dario",
        currency: data.currency || "MXN",
        expenses: data.expenses,
        deleted: data.deleted || {},
        updatedAt: Date.now(),
      };
      save();
      closeSheet();
      toast(data.expenses.length + " movimientos listos");
    }

    function importFromFile(file, names) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const text = String(reader.result || "");
          const name = (file.name || "").toLowerCase();
          let data;
          if (name.endsWith(".json") || text.trim().startsWith("{")) {
            data = JSON.parse(text);
          } else {
            data = splitwiseCsvToState(text, names);
          }
          if (names) {
            data.a = names.a || data.a;
            data.b = names.b || data.b;
            data.currency = names.currency || data.currency;
          }
          applyImportedState(data);
        } catch (err) {
          toast("Ese archivo no se pudo leer");
        }
      };
      reader.readAsText(file);
    }

    function parseCsv(text) {
      const rows = [];
      let row = [], cell = "", i = 0, quoted = false;
      text = String(text).replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      while (i < text.length) {
        const ch = text[i];
        if (quoted) {
          if (ch === '"') {
            if (text[i + 1] === '"') { cell += '"'; i += 2; continue; }
            quoted = false; i++; continue;
          }
          cell += ch; i++; continue;
        }
        if (ch === '"') { quoted = true; i++; continue; }
        if (ch === ",") { row.push(cell); cell = ""; i++; continue; }
        if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; i++; continue; }
        cell += ch; i++;
      }
      if (cell.length || row.length) { row.push(cell); rows.push(row); }
      return rows.filter((r) => r.some((c) => String(c).trim()));
    }

    function csvNum(s) {
      const n = parseAmount(s);
      return Number.isFinite(n) ? n : null;
    }

    function splitwiseCsvToState(text, names) {
      const rows = parseCsv(text);
      if (rows.length < 2) throw new Error("csv vacío");
      const header = rows[0].map((h) => h.trim());
      const idx = {
        fecha: header.findIndex((h) => /fecha|date/i.test(h)),
        desc: header.findIndex((h) => /desc/i.test(h)),
        cat: header.findIndex((h) => /categor/i.test(h)),
        coste: header.findIndex((h) => /coste|cost|total/i.test(h)),
        moneda: header.findIndex((h) => /moneda|currency/i.test(h)),
      };
      const skip = new Set(Object.values(idx));
      const people = header
        .map((name, i) => ({ name, i }))
        .filter((p) => p.name && !skip.has(p.i) && !/^moneda$|^currency$/i.test(p.name));
      if (people.length < 2) throw new Error("faltan personas");
      const pa = people[0];
      const pb = people[1];
      const expenses = [];
      for (const r of rows.slice(1)) {
        const desc = (r[idx.desc] || "").trim();
        const cat = (idx.cat >= 0 ? r[idx.cat] : "") || "";
        const cost = csvNum(r[idx.coste]);
        const israel = csvNum(r[pa.i]);
        const dario = csvNum(r[pb.i]);
        const fecha = (r[idx.fecha] || "").trim();
        if (!fecha || /saldo total|total balance/i.test(desc) || cost == null) continue;
        const paid = (israel || 0) >= 0 ? "a" : "b";
        const owed = (israel || 0) >= 0 ? Math.abs(dario || 0) : Math.abs(israel || 0);
        const isPay = /pago/i.test(cat) || /pag[oó]/i.test(desc);
        let split = "half";
        if (Math.abs(owed - cost) < 0.02) split = "full";
        const ts = Date.parse(fecha.length === 10 ? fecha + "T12:00:00" : fecha);
        const item = {
          id: "sw-" + fecha + "-" + String(expenses.length + 1).padStart(2, "0"),
          type: isPay ? "settle" : "expense",
          amount: Math.round(cost * 100) / 100,
          desc: desc || (isPay ? "Pago" : "Gasto"),
          paidBy: paid,
          split: isPay ? "full" : split,
          ts: Number.isFinite(ts) ? ts : Date.now(),
        };
        const expected = item.split === "full" || isPay ? cost : cost / 2;
        if (Math.abs(owed - expected) >= 0.005) item.owed = Math.round(owed * 100) / 100;
        expenses.push(item);
      }
      return {
        ready: true,
        a: (names && names.a) || pa.name.replace(/\s+Ventura$/i, "") || "Israel",
        b: (names && names.b) || pb.name || "Dario",
        currency: (idx.moneda >= 0 && (rows[1][idx.moneda] || "").trim()) || (names && names.currency) || "MXN",
        expenses,
      };
    }

    function copySummary() {
      const net = netOf(state);
      const lines = [
        `Cuentas · ${state.a} y ${state.b}`,
        Math.abs(net) < 0.005
          ? "Están a mano."
          : net > 0
            ? `${state.b} le debe ${money(net, state)} a ${state.a}`
            : `${state.a} le debe ${money(Math.abs(net), state)} a ${state.b}`,
        "",
      ];
      const last = [...state.expenses].sort((x, y) => y.ts - x.ts).slice(0, 12);
      if (last.length) {
        lines.push("Últimos movimientos:");
        for (const e of last) {
          const who = e.paidBy === "a" ? state.a : state.b;
          const tag = e.type === "settle" ? "pago" : (e.desc || "gasto");
          lines.push(`• ${tag} ${money(e.amount, state)} (pagó ${who})`);
        }
      }
      copyText(lines.join("\n"));
      toast("Resumen copiado");
    }

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      } else fallbackCopy(text);
    }
    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch {}
      ta.remove();
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function ini(name) {
      const p = String(name || "?").trim();
      return esc((p[0] || "?").toUpperCase());
    }

    async function boot() {
      if (roomId) {
        await pull();
        if (state && Array.isArray(state.expenses) && !state.ready) state.ready = true;
      }
      render();
      if (state && state.ready) await ensureRoom();
      setInterval(() => {
        if (document.visibilityState === "visible") pull();
      }, 4000);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") pull();
      });
    }
    boot();
  </script>
</body>
