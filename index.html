<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#162d4d" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Entre Dos" />
  <title>Entre Dos · Israel y Dario</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=IBM+Plex+Mono:wght@500;600;700&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%230d9b7a'/%3E%3Cpath d='M20 36c0-8 5-14 12-14 5 0 9 3 10 7' stroke='white' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='34' r='3' fill='white'/%3E%3Cpath d='M44 28c0 8-5 14-12 14-5 0-9-3-10-7' stroke='white' stroke-width='4' fill='none' stroke-linecap='round'/%3E%3C/svg%3E" />
  <style>
    :root {
      --ink: #162d4d;
      --paper: #f4ead8;
      --lime: #e7b84e;
      --coral: #b85f50;
      --cream: #fff8e9;
      --line: #cdbb9d;
      --sky: #79b8e7;
      --muted: #6d746d;
      --teal: #162d4d;
      --teal-ink: #162d4d;
      --teal-soft: #f1d69c;
      --owe: #b85f50;
      --bg: #f4ead8;
      --card: #fff8e9;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --cover: url("cover.jpg?v=4");
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --serif: "Instrument Serif", Georgia, serif;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    html, body { min-height: 100%; }
    body {
      background: var(--paper);
      color: var(--ink);
      font-family: "DM Sans", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    button, input, select, textarea { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; }
    input, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      background: #fff;
      border-radius: 0;
      padding: 13px;
      font-size: 16px;
      outline: none;
    }
    input:focus, select:focus, textarea:focus {
      border-color: var(--ink);
      box-shadow: 0 0 0 2px var(--lime);
    }
    .app { min-height: 100%; }
    .app.is-home { padding: 0; }
    .hidden { display: none !important; }

    .setup {
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 16px;
      padding: 28px 20px 48px;
    }
    .setup-cover {
      height: 240px;
      background: var(--cover) center 22% / cover no-repeat;
      position: relative;
    }
    .setup-cover::after {
      content: "";
      position: absolute; inset: 0;
      background: linear-gradient(180deg, transparent 40%, rgba(22,45,77,.45) 100%);
    }
    .setup h1 {
      font-size: 42px;
      letter-spacing: -.06em;
      font-weight: 650;
      line-height: .95;
    }
    .setup h1 em { color: var(--coral); font-family: var(--serif); font-style: italic; font-weight: 400; }
    .lede { color: var(--muted); font-size: 15px; line-height: 1.45; }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field span, .field > span { font-size: 12px; font-weight: 700; }
    .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 8px;
      min-height: 50px; padding: 15px 19px;
      background: var(--ink); color: #fff; font-weight: 700;
    }
    .btn:active { transform: translateY(1px); }
    .btn.ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
    .btn.danger { background: var(--coral); }
    .btn.full { width: 100%; }

    .topbar {
      border-bottom: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center;
      height: 80px; padding: 0 6vw;
    }
    .brand {
      color: var(--ink); font: 800 15px var(--mono);
      letter-spacing: .12em; display: flex; align-items: center; gap: 10px;
      text-decoration: none;
    }
    .brand span {
      border: 1.5px solid; border-radius: 50%;
      width: 28px; height: 28px; display: grid; place-items: center; font-size: 17px;
    }
    .people { display: flex; align-items: center; font-size: 14px; font-weight: 600; gap: 0; }
    .sync-dot {
      background: #68a96b; border-radius: 50%; width: 8px; height: 8px; margin-right: 7px;
    }
    .sync-dot.working { background: var(--lime); animation: 1s infinite pulse; }
    @keyframes pulse { 50% { opacity: .5; } }
    .sync-label, .sync-pill {
      color: #6d746d; font: 700 9px var(--mono); letter-spacing: .08em;
      text-transform: uppercase; margin-right: 16px; background: none; border: 0;
      padding: 0; display: inline-flex; align-items: center; gap: 0;
    }
    .sync-pill i { display: none; }
    .avatar, .av {
      border: 2px solid var(--paper); width: 34px; height: 34px;
      font: 700 12px var(--mono); border-radius: 50%;
      display: grid; place-items: center; color: var(--ink);
    }
    .av.a, .avatar.you { background: var(--sky); }
    .av.b, .avatar.alex { background: var(--lime); margin-left: -8px; margin-right: 10px; }
    .more { color: var(--ink); font-size: 18px; margin-left: 8px; padding: 6px; }

    .stage {
      background: #e9cf9f;
      display: grid;
      grid-template-columns: minmax(0,1.05fr) minmax(280px,.95fr);
      margin: 0 0 55px;
      min-height: 520px;
      overflow: hidden;
    }
    .cover-photo {
      width: 100%; height: 100%; min-height: 520px;
      object-fit: cover; object-position: center 22%; display: block;
    }
    .hero-copy {
      background: linear-gradient(145deg, #efdba9 0%, #d7ad6d 100%);
      display: flex; flex-direction: column; justify-content: flex-end;
      padding: 70px 5vw;
    }
    .eyebrow {
      font: 700 12px var(--mono); letter-spacing: .16em;
      display: flex; align-items: center; gap: 10px; text-transform: uppercase;
    }
    .eyebrow span, .eyebrow i { background: var(--coral); width: 26px; height: 2px; display: block; }
    .hero-copy h1 {
      letter-spacing: -.07em; margin: 29px 0 0;
      font-size: clamp(42px, 5.6vw, 84px); font-weight: 650; line-height: .9;
    }
    .hero-copy h1 em { color: var(--coral); font-family: var(--serif); font-weight: 400; }

    .dashboard {
      display: grid; grid-template-columns: 1.7fr 1fr; gap: 16px;
      padding: 0 6vw 80px;
    }
    .balance-card {
      background: var(--ink); color: #fff; min-height: 350px;
      padding: 34px 38px; position: relative;
      box-shadow: 0 18px 50px #172f5220;
    }
    .card-top {
      font: 700 11px var(--mono); letter-spacing: .15em; color: #aeb8b1;
      display: flex; justify-content: space-between;
    }
    .card-top button { color: #fff; }
    .balance-card h2 {
      color: var(--lime); margin: 58px 0 8px;
      font: italic 400 22px var(--serif);
    }
    .big-number {
      letter-spacing: -.06em;
      font-size: clamp(44px, 5.4vw, 74px); font-weight: 650;
    }
    .balance-card p { color: #aeb8b1; max-width: 500px; font-size: 14px; line-height: 1.5; }
    .settle {
      background: var(--lime); color: var(--ink); border: 0;
      padding: 15px 19px; font-weight: 750;
      position: absolute; bottom: 34px; right: 38px;
    }
    .settle:disabled { opacity: .45; cursor: not-allowed; }
    .summary-stack { display: grid; gap: 16px; }
    .summary {
      border: 1px solid var(--line); min-height: 167px; padding: 31px;
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .summary span { font: 700 11px var(--mono); letter-spacing: .13em; }
    .summary strong { letter-spacing: -.04em; font-size: 37px; }
    .summary small { color: #5e685f; }
    .coral { background: var(--coral); border-color: var(--coral); color: #fff; }
    .coral small { color: #f7ded2; }
    .cream { background: var(--cream); }

    .expenses { background: #ebe7dd; padding: 72px 6vw 100px; }
    .section-heading {
      display: flex; justify-content: space-between; align-items: flex-end;
      margin-bottom: 38px;
    }
    .eyebrow.small { font-size: 10px; }
    .section-heading h2 { letter-spacing: -.04em; margin: 11px 0 0; font-size: 39px; }
    .heading-actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .add {
      background: var(--ink); color: #fff; padding: 15px 19px; font-weight: 700;
    }
    .add.ghost {
      background: #fff; color: var(--ink); border: 1px solid var(--ink);
    }
    .month-group { margin-bottom: 38px; }
    .month-divider {
      border-bottom: 1px solid var(--ink); text-transform: capitalize;
      background: #ebe7dd; display: flex; justify-content: space-between; align-items: center;
      padding: 14px 0 12px; position: sticky; top: 0; z-index: 2;
    }
    .month-divider strong { font: italic 600 22px var(--serif); }
    .month-divider span {
      font: 700 9px var(--mono); letter-spacing: .12em; color: #77766f; text-transform: uppercase;
    }
    .expense-row {
      -webkit-appearance: none;
      appearance: none;
      border: 0;
      border-bottom: 1px solid var(--line);
      display: grid;
      grid-template-columns: 52px minmax(0, 1fr) 110px 132px;
      align-items: center;
      column-gap: 18px;
      padding: 20px 0;
      width: 100%;
      max-width: 100%;
      text-align: left;
      background: none;
      color: inherit;
      font: inherit;
      line-height: 1.25;
      white-space: normal;
      box-sizing: border-box;
    }
    .category-icon, .dot {
      background: var(--cream); border: 1px solid #d7cab4; border-radius: 50%;
      width: 44px; height: 44px; font-size: 20px;
      display: grid; place-items: center;
    }
    .dot.pic, .category-icon.pic { background-size: cover; background-position: center; font-size: 0; border: 0; }
    .expense-main, .paid, .expense-amount { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .expense-main strong {
      font-size: 17px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .expense-main span, .expense-amount span {
      color: #737970; font-size: 12px;
      overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    }
    .paid { width: 110px; }
    .paid span { font: 700 9px var(--mono); letter-spacing: .12em; color: #81867f; }
    .expense-amount {
      width: 132px;
      text-align: right;
      font-variant-numeric: tabular-nums;
      justify-self: end;
    }
    .expense-amount strong { white-space: nowrap; }
    .site-foot {
      border-top: 1px solid var(--line);
      display: flex; justify-content: space-between; align-items: center;
      padding: 43px 6vw; gap: 16px;
    }
    .site-foot span { font: 800 12px var(--mono); letter-spacing: .14em; }
    .site-foot p, .site-foot small { color: #697269; font-size: 12px; }
    .site-foot button { color: inherit; text-decoration: underline; font: inherit; }
    .photo-box { border: 1px dashed var(--line); background: #fff; min-height: 88px; }
    .photo-box img { width: 100%; max-height: 220px; object-fit: cover; display: block; }
    .photo-box .photo-actions { display: flex; gap: 8px; padding: 10px; }
    .photo-box .photo-actions .btn { min-height: 42px; font-size: 14px; }
    .receipt { width: 100%; background: #111; max-height: 360px; }
    .receipt img { width: 100%; max-height: 360px; object-fit: contain; display: block; }

    .empty { color: #737970; padding: 40px 0; }
    .empty strong { display: block; color: var(--ink); font-size: 17px; margin-bottom: 6px; }

    .overlay {
      position: fixed; inset: 0; background: #0f1c15a6;
      z-index: 20; display: grid; place-items: center; padding: 20px;
    }
    .sheet {
      width: min(590px, 100%);
      background: var(--cream);
      padding: 38px 38px calc(28px + var(--safe-b));
      max-height: 92vh; overflow: auto;
      box-shadow: 0 25px 80px #07140d55;
    }
    .grab { display: none; }
    .sheet h2 { letter-spacing: -.04em; font-size: 32px; margin: 8px 0 18px; }
    .amount-box { text-align: center; margin: 4px 0 14px; }
    .amount-box input {
      border: 0; box-shadow: none; text-align: center;
      font-size: 44px; font-weight: 650; letter-spacing: -.04em; padding: 0;
    }
    .amount-box input:focus { box-shadow: none; }
    .chips { display: flex; gap: 8px; flex-wrap: wrap; }
    .chip {
      flex: 1; min-height: 44px; border: 1px solid var(--line);
      background: #fff; font-weight: 700; font-size: 13px;
    }
    .chip.on { border-color: var(--ink); background: #f1d69c; box-shadow: inset 0 0 0 1px var(--ink); }
    .stack { display: flex; flex-direction: column; gap: 16px; }
    .hint { font-size: 13px; color: var(--muted); line-height: 1.4; }
    .toast {
      position: fixed; left: 50%; bottom: 28px;
      transform: translateX(-50%);
      background: var(--ink); color: #fff; padding: 10px 14px;
      font-size: 13px; z-index: 40; white-space: nowrap;
    }
    .settings .danger-zone { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
    textarea { min-height: 90px; resize: vertical; font-size: 13px; }

    @media (max-width: 760px) {
      .topbar { height: 68px; padding: 0 20px; }
      .people > span:last-of-type, .sync-label { display: none; }
      .sync-pill { margin-right: 10px; }
      .stage { grid-template-columns: 1fr; min-height: 0; margin: 0 0 42px; }
      .cover-photo { object-position: center 22%; height: 430px; min-height: 0; }
      .hero-copy { min-height: 240px; padding: 38px 24px; }
      .hero-copy h1 { font-size: 42px; }
      .dashboard { grid-template-columns: 1fr; padding: 0 20px 58px; }
      .balance-card { min-height: 390px; padding: 26px 24px; }
      .settle { bottom: 24px; left: 24px; right: 24px; }
      .expenses { padding: 55px 20px 75px; }
      .section-heading { align-items: flex-start; gap: 20px; }
      .section-heading h2 { font-size: 31px; }
      .add { padding: 12px 14px; font-size: 13px; }
      .add.icon-only { font-size: 0; padding: 12px; }
      .add.icon-only:after { content: "＋"; font-size: 22px; }
      .expense-row { grid-template-columns: 44px minmax(0, 1fr) minmax(88px, 110px); gap: 10px; }
      .paid { display: none; }
      .expense-amount strong { font-size: 14px; }
      .site-foot { flex-direction: column; align-items: flex-start; gap: 10px; padding: 32px 20px; }
      .sheet { padding: 30px 22px calc(24px + var(--safe-b)); }
    }
  </style>
</head>
<body>
  <div class="app" id="app"></div>
  <div id="overlay"></div>
  <div id="toast" class="toast hidden"></div>

  <script src="splitwise-data.js"></script>
  <script>
    const KEY = "cuentas-roomie-v1";
    const ROOM_KEY = "cuentas-roomie-room";
    const ME_KEY = "cuentas-roomie-me";
    const BLOB = "https://jsonblob.com/api/jsonBlob";
    const GH_RAW = "https://raw.githubusercontent.com/israelventura104-afk/el-depto/main";
    const GH_API = "https://api.github.com/repos/israelventura104-afk/el-depto/contents";
    const $ = (id) => document.getElementById(id);

    const ICONS = {
      super: "🛒", comida: "🍕", renta: "🏠", luz: "💡", agua: "🚿",
      gas: "🔥", internet: "📶", uber: "🚗", taxi: "🚕",
      farmacia: "💊", limpia: "🧹", mascota: "🐾", extra: "💸",
      settle: "🤝"
    };

    const CURRENCIES = [
      { code: "MXN", symbol: "$", locale: "es-MX" },
      { code: "USD", symbol: "US$", locale: "en-US" },
      { code: "EUR", symbol: "€", locale: "es-ES" },
      { code: "ARS", symbol: "$", locale: "es-AR" },
      { code: "COP", symbol: "$", locale: "es-CO" },
      { code: "CLP", symbol: "$", locale: "es-CL" },
      { code: "PEN", symbol: "S/", locale: "es-PE" },
    ];

    function uid() {
      return crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
    }

    function load() {
      try { return JSON.parse(localStorage.getItem(KEY) || "null"); }
      catch { return null; }
    }
    function localSave() {
      localStorage.setItem(KEY, JSON.stringify(state));
    }
    function save() {
      if (state) state.updatedAt = Date.now();
      localSave();
      schedulePush();
    }

    function parseAmount(raw) {
      let s = String(raw).trim().replace(/[^\d,.-]/g, "");
      if (!s) return NaN;
      if (s.includes(",") && s.includes(".")) {
        if (s.lastIndexOf(",") > s.lastIndexOf(".")) s = s.replace(/\./g, "").replace(",", ".");
        else s = s.replace(/,/g, "");
      } else if (s.includes(",")) {
        s = s.replace(",", ".");
      }
      const n = Number(s);
      return Number.isFinite(n) ? n : NaN;
    }

    function money(n, state) {
      const cur = CURRENCIES.find((c) => c.code === state.currency) || CURRENCIES[0];
      try {
        return new Intl.NumberFormat(cur.locale, {
          style: "currency",
          currency: cur.code,
          maximumFractionDigits: 2,
        }).format(n);
      } catch {
        return cur.symbol + Number(n).toFixed(2);
      }
    }

    function iconFor(desc, type) {
      if (type === "settle") return "💵";
      const t = (desc || "").toLowerCase();
      for (const [k, v] of Object.entries(ICONS)) {
        if (k !== "settle" && t.includes(k)) return v;
      }
      if (/super|walmart|soriana|oxxo|chedraui|mercado/.test(t)) return "🛒";
      if (/luz|cfe|electric/.test(t)) return "💡";
      if (/renta|alquiler|depto|casa/.test(t)) return "🏠";
      if (/uber|didi|gasolina|taxi/.test(t)) return "🚗";
      if (/comida|pizza|tacos|restaurante|rappi/.test(t)) return "🍕";
      if (/netflix|spotify|internet|wifi/.test(t)) return "📶";
      return "💸";
    }

    function categoryOf(e) {
      if (e.category) return e.category;
      if (e.type === "settle") return "Pago";
      const t = (e.desc || "").toLowerCase();
      if (/luz|cfe|electric/.test(t)) return "Electricidad";
      if (/agua/.test(t)) return "General";
      if (/internet|megacable|wifi|netflix/.test(t)) return "TV/teléfono/Internet";
      if (/walmart|aurrera|despensa|fruta|carne|leche|picaña/.test(t)) return "Alimentos";
      if (/comida|restaurante|desayuno|pizza|tacos/.test(t)) return "Restaurantes";
      if (/moto|uber|didi|taxi|gasolina/.test(t)) return "Transporte - Otro";
      if (/renta|gas|casa/.test(t)) return "Casa - Otro";
      return "General";
    }

    function when(ts) {
      const d = new Date(ts);
      const now = new Date();
      const one = 86400000;
      const start = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
      const diff = (start - day) / one;
      if (diff === 0) return "Hoy";
      if (diff === 1) return "Ayer";
      return d.toLocaleDateString("es", { day: "numeric", month: "short" });
    }

    function monthKey(ts) {
      const d = new Date(ts);
      return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0");
    }
    function monthLabel(key) {
      const [y, m] = key.split("-").map(Number);
      const d = new Date(y, m - 1, 1);
      const now = new Date();
      if (y === now.getFullYear() && m === now.getMonth() + 1) return "Este mes";
      return d.toLocaleDateString("es", { month: "long", year: "numeric" });
    }

    function shareOf(e) {
      if (e.type === "settle") return e.amount;
      if (e.owed != null) return Number(e.owed);
      return e.split === "full" ? e.amount : e.amount / 2;
    }

    /** net > 0 ⇒ B le debe a A. net < 0 ⇒ A le debe a B. */
    function netOf(state) {
      let net = 0;
      for (const e of state.expenses) {
        const share = shareOf(e);
        if (e.type === "settle") net += e.paidBy === "a" ? share : -share;
        else net += e.paidBy === "a" ? share : -share;
      }
      return Math.round(net * 100) / 100;
    }

    function toast(msg) {
      const el = $("toast");
      el.textContent = msg;
      el.classList.remove("hidden");
      clearTimeout(toast._t);
      toast._t = setTimeout(() => el.classList.add("hidden"), 2200);
    }

    let state = load();
    let ui = { sheet: null, editId: null, importOpen: false };
    let me = localStorage.getItem(ME_KEY) || "";
    let roomId = "depto";
    let syncStatus = "saving";
    let apiBase = null;
    let pushTimer = null;
    let pulling = false;
    let pushing = false;

    if (roomId) {
      localStorage.setItem(ROOM_KEY, roomId);
      const u = new URL(location.href);
      u.searchParams.set("sala", roomId);
      history.replaceState(null, "", u);
    }

    function setMe(who) {
      me = who;
      localStorage.setItem(ME_KEY, who);
    }

    function setRoom(id) {
      roomId = String(id || "").trim();

      u.searchParams.set("sala", roomId);

    function payload() {
      return {
        ready: true,
        a: state.a,
        b: state.b,
        currency: state.currency,
        expenses: state.expenses || [],
        deleted: state.deleted || {},
        updatedAt: state.updatedAt || Date.now(),

    function blobIdFromResponse(res) {
      const loc = res.headers.get("Location") || res.headers.get("location") || "";
      const part = loc.split("/").filter(Boolean).pop();
      return part || "";
    }

    const photoCache = {};

    function compressImage(file, maxSide, quality) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const url = URL.createObjectURL(file);
        img.onload = () => {
          const scale = Math.min(1, maxSide / Math.max(img.width, img.height));
          const w = Math.max(1, Math.round(img.width * scale));
          const h = Math.max(1, Math.round(img.height * scale));
          const canvas = document.createElement("canvas");
          canvas.width = w;
          canvas.height = h;
          canvas.getContext("2d").drawImage(img, 0, 0, w, h);
          URL.revokeObjectURL(url);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("img")); };
        img.src = url;
      });
    }

    async function fetchGithubFile(path) {
      const r = await fetch(GH_API + "/" + path + "?ref=main&t=" + Date.now(), {
        headers: { Accept: "application/vnd.github.raw+json" },
        cache: "no-store",
      });
      if (!r.ok) throw new Error("gh " + r.status);
      return r.json();
    }

    async function discoverApi() {
      try {
        const t = await fetchGithubFile("tunnel.json");
        if (!t || !t.url) return null;
        const health = await fetch(String(t.url).replace(/\/$/, "") + "/health", { cache: "no-store" });
        if (!health.ok) return null;
        apiBase = String(t.url).replace(/\/$/, "");
        return apiBase;
      } catch {
        apiBase = null;
        return null;
      }
    }

    async function uploadPhoto(dataUrl) {
      await discoverApi();
      if (apiBase) {
        const res = await fetch(apiBase + "/photo", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ d: dataUrl }),
        });
        if (!res.ok) throw new Error("foto " + res.status);
        const j = await res.json();
        if (!j.id) throw new Error("sin id foto");
        photoCache[j.id] = dataUrl;
        try { localStorage.setItem("foto-" + j.id, dataUrl); } catch {}
        return j.id;
      }
      photoCache[dataUrl.slice(0, 40)] = dataUrl;
      return dataUrl;
    }

    async function fetchPhoto(id) {
      if (!id) return null;
      if (id.indexOf("data:image") === 0) return id;
      if (photoCache[id]) return photoCache[id];
      try {
        const local = localStorage.getItem("foto-" + id);
        if (local) { photoCache[id] = local; return local; }
      } catch {}
      await discoverApi();
      if (apiBase) {
        const res = await fetch(apiBase + "/photo/" + encodeURIComponent(id), { cache: "no-store" });
        if (res.ok) {
          const j = await res.json();
          if (j && j.d) {
            photoCache[id] = j.d;
            try { localStorage.setItem("foto-" + id, j.d); } catch {}
            return j.d;
          }
        }
      }
      return null;
    }

    function schedulePush() {
      clearTimeout(pushTimer);
      pushTimer = setTimeout(pushNow, 280);
    }

    async function pushNow() {
      if (pushing) return;
      pushing = true;
      syncStatus = "saving";
      updateSyncPill();
      try {
        await discoverApi();
        if (!apiBase) throw new Error("sin tunel");
        const res = await fetch(apiBase + "/state", {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(payload()),
        });
        if (!res.ok) throw new Error("put " + res.status);
        syncStatus = "live";
      } catch {
        syncStatus = "readonly";
      } finally {
        pushing = false;
        updateSyncPill();
      }
    }

    function mergeStates(local, remote) {
      if (!local || !local.ready) return { ...remote, ready: true };
      const deleted = { ...(remote.deleted || {}), ...(local.deleted || {}) };
      const map = new Map();
      for (const e of remote.expenses || []) if (e && e.id && !deleted[e.id]) map.set(e.id, e);
      for (const e of local.expenses || []) {
        if (!e || !e.id || deleted[e.id]) continue;
        const prev = map.get(e.id);
        if (!prev || (e.updatedAt || e.ts || 0) >= (prev.updatedAt || prev.ts || 0)) map.set(e.id, e);
      }
      const localNewer = (local.updatedAt || 0) >= (remote.updatedAt || 0);
      return {
        ready: true,
        a: localNewer ? (local.a || remote.a) : (remote.a || local.a),
        b: localNewer ? (local.b || remote.b) : (remote.b || local.b),
        currency: localNewer ? (local.currency || remote.currency) : (remote.currency || local.currency),
        expenses: [...map.values()],
        deleted,
        updatedAt: Math.max(local.updatedAt || 0, remote.updatedAt || 0),
      };
    }

    async function pull() {
      if (pulling || pushing) return;
      pulling = true;
      try {
        await discoverApi();
        let remote = null;
        if (apiBase) {
          const res = await fetch(apiBase + "/state", { cache: "no-store" });
          if (res.ok) remote = await res.json();
          syncStatus = "live";
        } else {
          try { remote = await fetchGithubFile("data.json"); } catch { remote = null; }
          syncStatus = remote ? "readonly" : "err";
        }
        if (!remote || !Array.isArray(remote.expenses)) return;
        const merged = mergeStates(state, remote);
        const before = JSON.stringify({
          a: state && state.a, b: state && state.b, c: state && state.currency,
          e: state && state.expenses, d: state && state.deleted,
        });
        const after = JSON.stringify({
          a: merged.a, b: merged.b, c: merged.currency, e: merged.expenses, d: merged.deleted,
        });
        if (before !== after) {
          state = merged;
          localSave();
          if (!ui.sheet) render();
        }
      } catch {
        if (syncStatus !== "saving") syncStatus = "err";
      } finally {
        pulling = false;
        updateSyncPill();
      }
    }

    async function ensureRoom() {
      await pull();
      if (state && state.ready && apiBase) await pushNow();
    }

            </div>
          </div>
        </div>`;
    }

    function detailSheet() {
      const e = state.expenses.find((x) => x.id === ui.editId);
      if (!e) return "";
      const who = e.paidBy === "a" ? state.a : state.b;
      const other = e.paidBy === "a" ? state.b : state.a;
      return `
        <div class="overlay" id="backdrop">
          <div class="sheet" onclick="event.stopPropagation()">
            <div class="grab"></div>
            <h2>${e.type === "settle" ? "Pago" : esc(e.desc || "Gasto")}</h2>
            <div class="stack">
              <p class="hint">
                ${money(e.amount, state)} · ${e.type === "settle"
                  ? `${esc(who)} le pagó a ${esc(other)}`
                  : `pagó ${esc(who)}${e.split === "full" ? `, lo debe ${esc(other)}` : ", a la mitad"}`}
                <br/>${new Date(e.ts).toLocaleString("es")}
              </p>
              <div class="receipt ${e.photoId || e.photoThumb ? "" : "hidden"}" id="receiptBox">
                <img id="receiptImg" alt="Ticket" ${e.photoThumb ? `src="${e.photoThumb}"` : ""} />
              </div>
              <button class="btn full" id="editExp">Editar</button>
              <button class="btn danger full" id="delExp">Borrar</button>
              <button class="btn ghost full" id="cancelSheet">Cerrar</button>
            </div>
          </div>
        </div>`;
    }

    function settingsSheet() {
      const opts = CURRENCIES.map((c) =>
        `<option value="${c.code}" ${c.code === state.currency ? "selected" : ""}>${c.code}</option>`
      ).join("");
      return `
        <div class="overlay" id="backdrop">
          <div class="sheet settings" onclick="event.stopPropagation()">
            <div class="grab"></div>
            <h2>Ajustes</h2>
            <div class="stack">
              <div class="row-2">
                <label class="field"><span>Tú</span><input id="setA" value="${esc(state.a)}" maxlength="24" /></label>
                <label class="field"><span>Roomie</span><input id="setB" value="${esc(state.b)}" maxlength="24" /></label>
              </div>
              <label class="field"><span>Moneda</span><select id="setCur">${opts}</select></label>
              <div class="field">
                <span>En este aparato, ¿quién eres?</span>
                <div class="chips">
                  <button class="chip ${me !== "b" ? "on" : ""}" data-me="a" type="button">${esc(state.a)}</button>
                  <button class="chip ${me === "b" ? "on" : ""}" data-me="b" type="button">${esc(state.b)}</button>
                </div>
              </div>
              <p class="hint">El enlace es siempre el mismo. En la laptop deja abierta la ventana “El depto - en vivo”.</p>
              <button class="btn full" id="copyLinkBtn">Copiar enlace de la sala</button>
              <button class="btn ghost full" id="retrySyncBtn">Sincronizar ahora</button>
              <button class="btn full" id="saveSet">Guardar nombres</button>
              <button class="btn ghost full" id="loadSeedBtn">Cargar gastos de Splitwise</button>
              <button class="btn ghost full" id="csvBtn">Importar CSV de Splitwise</button>
              <input id="csvFile" type="file" accept=".csv,.json,text/csv,application/json" hidden />
              <button class="btn ghost full" id="exportBtn">Copiar respaldo</button>
              <button class="btn ghost full" id="importBtn">Pegar respaldo</button>
              ${ui.importOpen ? `<textarea id="importBox" placeholder="Pega aquí el respaldo"></textarea>
                <button class="btn full" id="doImport">Importar</button>` : ""}
              <div class="danger-zone">
                <p class="hint">Borrar todo deja la app como nueva. No se puede deshacer.</p>
                <button class="btn danger full" id="wipeBtn">Borrar todo</button>
              </div>
              <button class="btn ghost full" id="cancelSheet">Cerrar</button>
            </div>
          </div>
        </div>`;
    }

    function bindSheet() {
      const backdrop = $("backdrop");
      if (!backdrop) return;
      backdrop.onclick = closeSheet;
      const cancel = $("cancelSheet");
      if (cancel) cancel.onclick = closeSheet;

      if (ui.sheet === "add") {
        let paid = (ui.editId && state.expenses.find((e) => e.id === ui.editId)?.paidBy) || "a";
        let split = (ui.editId && state.expenses.find((e) => e.id === ui.editId)?.split) || "half";
        const hint = () => {
          const n = parseAmount($("amt").value);
          const who = paid === "a" ? state.a : state.b;
          const other = paid === "a" ? state.b : state.a;
          if (!Number.isFinite(n) || n <= 0) {
            $("splitHint").textContent = split === "half"
              ? `Se parte en dos. ${other} le queda debiendo la mitad a ${who}.`
              : `${other} le debe el total a ${who}.`;
            return;
          }
          $("splitHint").textContent = split === "half"
            ? `${other} le queda debiendo ${money(n / 2, state)} a ${who}.`
            : `${other} le queda debiendo ${money(n, state)} a ${who}.`;
        };
        hint();
        $("amt").addEventListener("input", hint);
        for (const c of document.querySelectorAll("[data-paid]")) {
          c.onclick = () => {
            paid = c.dataset.paid;
            document.querySelectorAll("[data-paid]").forEach((x) => x.classList.toggle("on", x === c));
            hint();
          };
        }
        for (const c of document.querySelectorAll("[data-split]")) {
          c.onclick = () => {
            split = c.dataset.split;
            document.querySelectorAll("[data-split]").forEach((x) => x.classList.toggle("on", x === c));
            hint();
          };
        }
        let pendingPhoto = null;
        let pendingThumb = null;
        let photoRemoved = false;
        const existing = ui.editId ? state.expenses.find((e) => e.id === ui.editId) : null;
        $("photoBtn").onclick = () => $("photoFile").click();
        $("photoClear").onclick = () => {
          pendingPhoto = null;
          pendingThumb = null;
          photoRemoved = true;
          $("photoPrev").src = "";
          $("photoPrev").classList.add("hidden");
          $("photoClear").classList.add("hidden");
        };
        $("photoFile").onchange = async (ev) => {
          const file = ev.target.files && ev.target.files[0];
          if (!file) return;
          try {
            toast("Preparando foto…");
            pendingPhoto = await compressImage(file, 900, 0.62);
            pendingThumb = await compressImage(file, 96, 0.5);
            photoRemoved = false;
            $("photoPrev").src = pendingThumb;
            $("photoPrev").classList.remove("hidden");
            $("photoClear").classList.remove("hidden");
            toast("Foto lista");
          } catch {
            toast("No se pudo leer esa foto");
          }
        };
        $("saveExp").onclick = async () => {
          const amount = parseAmount($("amt").value);
          const desc = $("desc").value.trim();
          if (!Number.isFinite(amount) || amount <= 0) { toast("Pon un monto válido"); return; }
          const btn = $("saveExp");
          btn.disabled = true;
          let photoId = existing ? existing.photoId : null;
          let photoThumb = existing ? existing.photoThumb : null;
          if (photoRemoved) { photoId = null; photoThumb = null; }
          if (pendingPhoto) {
            try {
              toast("Subiendo foto…");
              photoId = await uploadPhoto(pendingPhoto);
              photoThumb = pendingThumb;
            } catch {
              btn.disabled = false;
              toast("La foto no se pudo subir. Revisa internet");
              return;
            }
          }
          if (ui.editId) {
            const e = state.expenses.find((x) => x.id === ui.editId);
            if (e) Object.assign(e, { amount, desc, paidBy: paid, split, updatedAt: Date.now(), photoId, photoThumb });
          } else {
            state.expenses.push({
              id: uid(), type: "expense", amount, desc, paidBy: paid, split,
              ts: Date.now(), updatedAt: Date.now(), photoId, photoThumb,
            });
          }
          save();
          closeSheet();
          toast("Listo");
        };
        setTimeout(() => $("amt").focus(), 50);
      }

      if (ui.sheet === "settle") {
        const edit = ui.editId ? state.expenses.find((e) => e.id === ui.editId) : null;
        let payer = edit ? edit.paidBy : (document.querySelector("[data-payer].on")?.dataset.payer || "b");
        const hint = () => {
          const n = parseAmount($("settleAmt").value);
          const who = payer === "a" ? state.a : state.b;
          const other = payer === "a" ? state.b : state.a;
          const el = $("abonoHint");
          if (!el) return;
          if (!Number.isFinite(n) || n <= 0) {
            el.textContent = `${who} le da dinero a ${other}. No se parte. Baja lo que ${who} debe, o si no debía, ahora ${other} le queda debiendo.`;
            return;
          }
          el.textContent = `${who} le abona ${money(n, state)} a ${other}. No es un gasto.`;
        };
        hint();
        $("settleAmt").addEventListener("input", hint);
        for (const c of document.querySelectorAll("[data-payer]")) {
          c.onclick = () => {
            payer = c.dataset.payer;
            document.querySelectorAll("[data-payer]").forEach((x) => x.classList.toggle("on", x === c));
            hint();
          };
        }
        $("saveSettle").onclick = () => {
          const amount = parseAmount($("settleAmt").value);
          if (!Number.isFinite(amount) || amount <= 0) { toast("Pon un monto válido"); return; }
          const who = payer === "a" ? state.a : state.b;
          if (edit) {
            Object.assign(edit, {
              type: "settle",
              amount,
              desc: "Pago " + who,
              paidBy: payer,
              split: "full",
              updatedAt: Date.now(),
            });
          } else {
            state.expenses.push({
              id: uid(),
              type: "settle",
              amount,
              desc: "Pago " + who,
              paidBy: payer,
              split: "full",
              ts: Date.now(),
              updatedAt: Date.now(),
            });
          }
          save();
          closeSheet();
          toast("Abono listo");
        };
        setTimeout(() => $("settleAmt").focus(), 50);
      }

      if (ui.sheet === "detail") {
        const current = state.expenses.find((x) => x.id === ui.editId);
        if (current && current.photoId) {
          fetchPhoto(current.photoId).then((d) => {
            if (!d || !$("receiptImg")) return;
            $("receiptImg").src = d;
            $("receiptBox").classList.remove("hidden");
          });
        }
        const edit = $("editExp");
        if (edit) {
          edit.onclick = () => {
            ui.sheet = current && current.type === "settle" ? "settle" : "add";
            render();
          };
        }
        $("delExp").onclick = () => {
          state.deleted = state.deleted || {};
          state.deleted[ui.editId] = Date.now();
          state.expenses = state.expenses.filter((x) => x.id !== ui.editId);
          save();
          closeSheet();
          toast("Borrado");
        };
      }

      if (ui.sheet === "settings") {
        for (const c of document.querySelectorAll("[data-me]")) {
          c.onclick = () => {
            setMe(c.dataset.me);
            document.querySelectorAll("[data-me]").forEach((x) => x.classList.toggle("on", x === c));
          };
        }
        $("copyLinkBtn").onclick = async () => {
          await ensureRoom();
          copyText("https://israelventura104-afk.github.io/el-depto/");
          toast(syncStatus === "live" ? "Enlace copiado. Ya está en vivo" : "Enlace copiado. En la lap abre EnVivo.bat");
        };
        $("retrySyncBtn").onclick = async () => {
          await ensureRoom();
          await pushNow();
          toast(syncStatus === "live" ? "Al día" : "No se pudo sincronizar");
        };
        $("saveSet").onclick = () => {
          const a = $("setA").value.trim();
          const b = $("setB").value.trim();
          if (!a || !b) { toast("Faltan nombres"); return; }
          state.a = a; state.b = b; state.currency = $("setCur").value;
          save();
          closeSheet();
          toast("Guardado");
        };
        $("loadSeedBtn").onclick = () => {
          const seed = splitwiseSeed();
          if (!seed) return;
          if (state.expenses.length && !confirm("Esto reemplaza los gastos actuales por los de Splitwise.")) return;
          applyImportedState({
            ...seed,
            a: state.a,
            b: state.b,
            currency: state.currency,
            ready: true,
          });
        };
        $("csvBtn").onclick = () => $("csvFile").click();
        $("csvFile").onchange = (ev) => importFromFile(ev.target.files[0], { a: state.a, b: state.b, currency: state.currency });
        $("exportBtn").onclick = () => {
          copyText(JSON.stringify(state));
          toast("Respaldo copiado");
        };
        $("importBtn").onclick = () => { ui.importOpen = true; render(); };
        const doImp = $("doImport");
        if (doImp) {
          doImp.onclick = () => {
            try {
              const data = JSON.parse($("importBox").value);
              if (!data || !data.a || !data.b || !Array.isArray(data.expenses)) throw new Error("bad");
              data.ready = true;
              data.updatedAt = Date.now();
              state = data;
              save();
              closeSheet();
              toast("Importado");
            } catch {
              toast("Ese respaldo no sirve");
            }
          };
        }
        $("wipeBtn").onclick = () => {
          if (!confirm("¿Borrar todos los gastos?")) return;
          state = null;
          localStorage.removeItem(KEY);
          closeSheet();
        };
      }
    }

    function splitwiseSeed() {
      if (typeof SPLITWISE_SEED === "undefined") {
        toast("No está el archivo splitwise-data.js");
        return null;
      }
      return SPLITWISE_SEED;
    }

    function applyImportedState(data) {
      if (!data || !Array.isArray(data.expenses)) {
        toast("No se pudo importar");
        return;
      }
      state = {
        ready: true,
        a: data.a || "Israel",
        b: data.b || "Dario",
        currency: data.currency || "MXN",
        expenses: data.expenses,
        deleted: data.deleted || {},
        updatedAt: Date.now(),
      };
      save();
      closeSheet();
      toast(data.expenses.length + " movimientos listos");
    }

    function importFromFile(file, names) {
      if (!file) return;
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const text = String(reader.result || "");
          const name = (file.name || "").toLowerCase();
          let data;
          if (name.endsWith(".json") || text.trim().startsWith("{")) {
            data = JSON.parse(text);
          } else {
            data = splitwiseCsvToState(text, names);
          }
          if (names) {
            data.a = names.a || data.a;
            data.b = names.b || data.b;
            data.currency = names.currency || data.currency;
          }
          applyImportedState(data);
        } catch (err) {
          toast("Ese archivo no se pudo leer");
        }
      };
      reader.readAsText(file);
    }

    function parseCsv(text) {
      const rows = [];
      let row = [], cell = "", i = 0, quoted = false;
      text = String(text).replace(/^\uFEFF/, "").replace(/\r\n/g, "\n").replace(/\r/g, "\n");
      while (i < text.length) {
        const ch = text[i];
        if (quoted) {
          if (ch === '"') {
            if (text[i + 1] === '"') { cell += '"'; i += 2; continue; }
            quoted = false; i++; continue;
          }
          cell += ch; i++; continue;
        }
        if (ch === '"') { quoted = true; i++; continue; }
        if (ch === ",") { row.push(cell); cell = ""; i++; continue; }
        if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; i++; continue; }
        cell += ch; i++;
      }
      if (cell.length || row.length) { row.push(cell); rows.push(row); }
      return rows.filter((r) => r.some((c) => String(c).trim()));
    }

    function csvNum(s) {
      const n = parseAmount(s);
      return Number.isFinite(n) ? n : null;
    }

    function splitwiseCsvToState(text, names) {
      const rows = parseCsv(text);
      if (rows.length < 2) throw new Error("csv vacío");
      const header = rows[0].map((h) => h.trim());
      const idx = {
        fecha: header.findIndex((h) => /fecha|date/i.test(h)),
        desc: header.findIndex((h) => /desc/i.test(h)),
        cat: header.findIndex((h) => /categor/i.test(h)),
        coste: header.findIndex((h) => /coste|cost|total/i.test(h)),
        moneda: header.findIndex((h) => /moneda|currency/i.test(h)),
      };
      const skip = new Set(Object.values(idx));
      const people = header
        .map((name, i) => ({ name, i }))
        .filter((p) => p.name && !skip.has(p.i) && !/^moneda$|^currency$/i.test(p.name));
      if (people.length < 2) throw new Error("faltan personas");
      const pa = people[0];
      const pb = people[1];
      const expenses = [];
      for (const r of rows.slice(1)) {
        const desc = (r[idx.desc] || "").trim();
        const cat = (idx.cat >= 0 ? r[idx.cat] : "") || "";
        const cost = csvNum(r[idx.coste]);
        const israel = csvNum(r[pa.i]);
        const dario = csvNum(r[pb.i]);
        const fecha = (r[idx.fecha] || "").trim();
        if (!fecha || /saldo total|total balance/i.test(desc) || cost == null) continue;
        const paid = (israel || 0) >= 0 ? "a" : "b";
        const owed = (israel || 0) >= 0 ? Math.abs(dario || 0) : Math.abs(israel || 0);
        const isPay = /pago/i.test(cat) || /pag[oó]/i.test(desc);
        let split = "half";
        if (Math.abs(owed - cost) < 0.02) split = "full";
        const ts = Date.parse(fecha.length === 10 ? fecha + "T12:00:00" : fecha);
        const item = {
          id: "sw-" + fecha + "-" + String(expenses.length + 1).padStart(2, "0"),
          type: isPay ? "settle" : "expense",
          amount: Math.round(cost * 100) / 100,
          desc: desc || (isPay ? "Pago" : "Gasto"),
          paidBy: paid,
          split: isPay ? "full" : split,
          ts: Number.isFinite(ts) ? ts : Date.now(),
        };
        const expected = item.split === "full" || isPay ? cost : cost / 2;
        if (Math.abs(owed - expected) >= 0.005) item.owed = Math.round(owed * 100) / 100;
        expenses.push(item);
      }
      return {
        ready: true,
        a: (names && names.a) || pa.name.replace(/\s+Ventura$/i, "") || "Israel",
        b: (names && names.b) || pb.name || "Dario",
        currency: (idx.moneda >= 0 && (rows[1][idx.moneda] || "").trim()) || (names && names.currency) || "MXN",
        expenses,
      };
    }

    function copySummary() {
      const net = netOf(state);
      const lines = [
        `Cuentas · ${state.a} y ${state.b}`,
        Math.abs(net) < 0.005
          ? "Están a mano."
          : net > 0
            ? `${state.b} le debe ${money(net, state)} a ${state.a}`
            : `${state.a} le debe ${money(Math.abs(net), state)} a ${state.b}`,
        "",
      ];
      const last = [...state.expenses].sort((x, y) => y.ts - x.ts).slice(0, 12);
      if (last.length) {
        lines.push("Últimos movimientos:");
        for (const e of last) {
          const who = e.paidBy === "a" ? state.a : state.b;
          const tag = e.type === "settle" ? "pago" : (e.desc || "gasto");
          lines.push(`• ${tag} ${money(e.amount, state)} (pagó ${who})`);
        }
      }
      copyText(lines.join("\n"));
      toast("Resumen copiado");
    }

    function copyText(text) {
      if (navigator.clipboard && window.isSecureContext) {
        navigator.clipboard.writeText(text).catch(() => fallbackCopy(text));
      } else fallbackCopy(text);
    }
    function fallbackCopy(text) {
      const ta = document.createElement("textarea");
      ta.value = text;
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand("copy"); } catch {}
      ta.remove();
    }

    function esc(s) {
      return String(s ?? "")
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }
    function ini(name) {
      const p = String(name || "?").trim();
      return esc((p[0] || "?").toUpperCase());
    }

    async function boot() {
      if (roomId) {
        await pull();
        if (state && Array.isArray(state.expenses) && !state.ready) state.ready = true;
      }
      render();
      if (state && state.ready) await ensureRoom();
      setInterval(() => {
        if (document.visibilityState === "visible") pull();
      }, 4000);
      document.addEventListener("visibilitychange", () => {
        if (document.visibilityState === "visible") pull();
      });
    }
    boot();
  </script>
</body>
</html>
